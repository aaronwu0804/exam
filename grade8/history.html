function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = quizData.map((item, idx) => `
    <div class="card" id="q_card_${idx}">
      <div class="q-title">${idx + 1}. ${item.q}</div>
      ${item.svg || ''}
      <div class="options">
        ${item.opts.map((opt, oIdx) => `
          <label class="opt-label" id="label_${idx}_${oIdx}">
            <input type="radio" name="q_${idx}" value="${oIdx}">
            <span>(${['A','B','C','D'][oIdx]})${opt}</span>
          </label>
        `).join('')}
      </div>
      <div class="explanation" id="exp_${idx}"></div>
    </div>
  `).join('');
}

function submitQuiz() {
  let score = 0;
  let unanswered = 0;

  quizData.forEach((item, idx) => {
    const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
    const expBox = document.getElementById(`exp_${idx}`);
    expBox.style.display = 'block';

    if (!selected) {
      unanswered++;
      expBox.className = 'explanation exp-wrong';
      expBox.innerHTML = `⚠️ <strong>未作答</strong>。正確答案為 <strong>(${['A','B','C','D'][item.ans]})</strong>。<br>解析：${item.exp}`;
    } else if (parseInt(selected.value) === item.ans) {
      score += 4;
      expBox.className = 'explanation exp-correct';
      expBox.innerHTML = `✓ <strong>回答正確！</strong><br>解析：${item.exp}`;
    } else {
      expBox.className = 'explanation exp-wrong';
      expBox.innerHTML = `✗ <strong>回答錯誤</strong>。正確答案為 <strong>(${['A','B','C','D'][item.ans]})</strong>。<br>解析：${item.exp}`;
    }
  });

  if (unanswered > 0) {
    if (!confirm(`您還有 ${unanswered} 題尚未作答，確定要送出交卷嗎？`)) return;
  }

  const banner = document.getElementById('scoreBanner');
  const finalScoreEl = document.getElementById('finalScore');
  banner.style.display = 'block';
  finalScoreEl.textContent = `${score} 分`;
  finalScoreEl.style.color = score >= 60 ? 'var(--primary)' : 'var(--danger)';

  // 儲存至 LocalStorage (對應首頁八年級歷史)
  const record = {
    score: score,
    date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
  };
  localStorage.setItem('quiz_g8_history', JSON.stringify(record));

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetQuiz() {
  if (confirm('確定要清除目前答案並重新測驗嗎？')) {
    location.reload();
  }
}

renderQuiz();
</script>

</html>
